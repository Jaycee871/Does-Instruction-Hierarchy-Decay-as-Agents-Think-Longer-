name: Pilot manifest

on:
  push:
    paths:
      - 'src/ih_decay/sampling.py'
      - 'scripts/generate_pilot_manifest.py'
      - '.github/workflows/pilot-manifest.yml'
  workflow_dispatch:

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Generate 100-item stratified manifest
        run: |
          python scripts/generate_pilot_manifest.py \
            --items-per-file 25 \
            --seed 20260905 \
            --output pilot-manifest-v0.jsonl \
            | tee pilot-manifest-summary.json
      - name: Upload manifest
        uses: actions/upload-artifact@v4
        with:
          name: ih-decay-pilot-manifest-v0
          path: |
            pilot-manifest-v0.jsonl
            pilot-manifest-summary.json
