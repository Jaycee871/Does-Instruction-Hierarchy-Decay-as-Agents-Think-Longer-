name: NVIDIA model discovery

on:
  push:
    paths:
      - 'scripts/discover_nvidia_models.py'
      - '.github/workflows/nvidia-model-discovery.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Query currently accessible NVIDIA models
        run: python scripts/discover_nvidia_models.py
      - name: Upload model inventory
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-model-inventory
          path: nvidia-model-inventory.json
