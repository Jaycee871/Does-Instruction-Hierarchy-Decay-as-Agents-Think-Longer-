name: Dataset audit

on:
  push:
    paths:
      - 'scripts/audit_dataset.py'
      - '.github/workflows/dataset-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Stream and summarize all IH-Challenge files
        run: python scripts/audit_dataset.py | tee dataset-audit.json
      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: ih-challenge-audit
          path: dataset-audit.json
