name: IH-Challenge schema audit

on:
  push:
    paths:
      - 'scripts/audit_schema.py'
      - '.github/workflows/schema-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e .
      - name: Audit schema without exporting prompts or grader code
        run: python scripts/audit_schema.py
      - name: Upload schema report
        uses: actions/upload-artifact@v4
        with:
          name: ih-challenge-schema-audit
          path: schema-audit.json
