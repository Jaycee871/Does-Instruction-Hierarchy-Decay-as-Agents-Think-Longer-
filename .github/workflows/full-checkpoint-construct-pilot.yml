name: Full-checkpoint construct-validity pilot

on:
  push:
    branches:
      - phase1/full-checkpoint-construct-pilot
    paths:
      - ".github/workflows/full-checkpoint-construct-pilot.yml"
      - "scripts/run_matched_trajectory_shard.py"
      - "src/ih_decay/**"
      - "tests/**"
  workflow_dispatch:

jobs:
  full-checkpoint-shard:
    strategy:
      fail-fast: false
      matrix:
        source_file:
          - single-constraint.jsonl
          - multi-constraint.jsonl
          - input-conditioned.jsonl
          - anti-overrefusal.jsonl
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN1 }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Run two matched trajectories through step 20
        run: |
          python scripts/run_matched_trajectory_shard.py \
            --source-file '${{ matrix.source_file }}' \
            --items 2 \
            --seed 20260905 \
            --model openai/gpt-oss-20b \
            --max-tokens 4096 \
            --checkpoints 1,3,5,10,20 \
            --output-dir full-checkpoint-construct-pilot
      - name: Upload full-checkpoint artifacts even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-checkpoint-${{ matrix.source_file }}
          path: full-checkpoint-construct-pilot/
          if-no-files-found: warn
