name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-and-data-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN1 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e .[dev]
      - name: Unit tests
        run: pytest -q
      - name: Bucket loader smoke test
        run: python scripts/inspect_dataset.py --file single-constraint.jsonl --limit 3
