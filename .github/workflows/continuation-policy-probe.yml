name: Continuation policy probe

on:
  push:
    branches:
      - phase1/continuation-policy-probe
    paths:
      - ".github/workflows/continuation-policy-probe.yml"
      - "scripts/run_continuation_policy_probe.py"
      - "src/ih_decay/trajectory.py"
      - "tests/test_trajectory.py"
  workflow_dispatch:

jobs:
  policy-probe-shard:
    strategy:
      fail-fast: false
      matrix:
        source_file:
          - single-constraint.jsonl
          - multi-constraint.jsonl
          - input-conditioned.jsonl
          - anti-overrefusal.jsonl
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN1 }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Run paired continuation-policy probe
        run: |
          python scripts/run_continuation_policy_probe.py \
            --source-file '${{ matrix.source_file }}' \
            --items 1 \
            --seed 20260905 \
            --model openai/gpt-oss-20b \
            --max-tokens 4096 \
            --max-step 10 \
            --output-dir continuation-policy-probe
      - name: Upload probe artifacts even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuation-policy-${{ matrix.source_file }}
          path: continuation-policy-probe/
          if-no-files-found: warn
