name: Matched trajectory smoke

on:
  push:
    branches:
      - phase1/matched-trajectory-pilot
    paths:
      - "src/ih_decay/**"
      - "scripts/run_matched_trajectory_shard.py"
      - "tests/**"
      - ".github/workflows/matched-trajectory-smoke.yml"
  workflow_dispatch:

jobs:
  matched-trajectory-shard:
    strategy:
      fail-fast: false
      matrix:
        source_file:
          - single-constraint.jsonl
          - multi-constraint.jsonl
          - input-conditioned.jsonl
          - anti-overrefusal.jsonl
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN1 }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Run one-item matched trajectory through step 5
        run: |
          python scripts/run_matched_trajectory_shard.py \
            --source-file '${{ matrix.source_file }}' \
            --items 1 \
            --seed 20260905 \
            --model openai/gpt-oss-20b \
            --max-tokens 4096 \
            --checkpoints 1,3,5 \
            --output-dir matched-trajectory-smoke
      - name: Upload matched trajectory artifacts even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matched-trajectory-${{ matrix.source_file }}
          path: matched-trajectory-smoke/
          if-no-files-found: warn
