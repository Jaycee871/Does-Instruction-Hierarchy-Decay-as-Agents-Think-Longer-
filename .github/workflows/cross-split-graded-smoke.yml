name: Cross-split graded pipeline smoke

on:
  push:
    paths:
      - 'src/ih_decay/grader.py'
      - 'src/ih_decay/grader_contract.py'
      - 'src/ih_decay/_grader_worker.py'
      - 'src/ih_decay/attacks.py'
      - 'src/ih_decay/materialize.py'
      - 'src/ih_decay/providers.py'
      - 'scripts/smoke_cross_split_graded.py'
      - '.github/workflows/cross-split-graded-smoke.yml'
  workflow_dispatch:

jobs:
  cross-split-graded-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN1 }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Exercise all four benchmark split contracts end to end
        run: python scripts/smoke_cross_split_graded.py
      - name: Upload cross-split graded smoke artifact
        uses: actions/upload-artifact@v4
        with:
          name: cross-split-graded-pipeline-smoke
          path: cross-split-graded-smoke.json
