name: Credential smoke test

on:
  push:
    paths:
      - '.github/workflows/credential-smoke-test.yml'
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Test Hugging Face token
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN1 }}
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN"
          code=$(curl -sS -o /tmp/hf.json -w "%{http_code}" -H "Authorization: Bearer $HF_TOKEN" https://huggingface.co/api/whoami-v2)
          test "$code" = "200"
          echo "HF_TOKEN1: OK"

      - name: Test NVIDIA API key
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$NVIDIA_API_KEY"
          code=$(curl -sS -o /tmp/nv.json -w "%{http_code}" -H "Authorization: Bearer $NVIDIA_API_KEY" https://integrate.api.nvidia.com/v1/models)
          test "$code" = "200"
          echo "NVIDIA_API_KEY: OK"

      - name: Test Kaggle token presence and API auth
        env:
          KAGGLE_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$KAGGLE_TOKEN"
          python - <<'PY'
          import os, urllib.request
          token = os.environ['KAGGLE_TOKEN']
          req = urllib.request.Request(
              'https://www.kaggle.com/api/v1/datasets/list?page=1&search=iris',
              headers={'Authorization': f'Bearer {token}', 'User-Agent': 'credential-smoke-test'}
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  if r.status != 200:
                      raise SystemExit(f'Unexpected HTTP status: {r.status}')
              print('KAGGLE_TOKEN: OK')
          except Exception as e:
              raise SystemExit(f'KAGGLE_TOKEN auth test failed: {e}')
          PY
