[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ih-decay"
version = "0.1.0"
description = "Measure instruction-hierarchy persistence across agentic trajectory length."
requires-python = ">=3.10"
dependencies = [
  "huggingface_hub>=1.6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
